{% extends "admin_main_base.html" %}
{% block head_title %} {{ title }} {% endblock %}
{% load static %}
{% block content %}

<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper d-block d-block px-5 py-3">
	<!-- Content Header (Page header) -->
	<div class="content-header">
		<div class="container-fluid">
			<div class="row mb-2">
				<div class="col-sm-6">
					<h1 class="m-0">{{ title }}</h1>
				</div><!-- /.col -->
			</div><!-- /.row -->
		</div><!-- /.container-fluid -->
	</div>
	<!-- /.content-header -->

	<!-- Main content -->
	<section class="content">

		<!-- Default box -->
		<div class="card">
			<div class="card-header">
				<h3 class="card-title">Group name : {{ group.name }}</h3>

				<div class="card-tools">
					<button type="button" class="btn btn-tool" data-card-widget="collapse" title="Collapse">
						<i class="fas fa-minus"></i>
					</button>
					<button type="button" class="btn btn-tool" data-card-widget="remove" title="Remove">
						<i class="fas fa-times"></i>
					</button>
				</div>
			</div>
			<div class="card-body">
				<div class="row">
					<div class="col order-2 order-md-1">
						<div class="row">
							<div class="col-10 text-center">
								<h4 class="mb-3">{{ content }}</h4>
								<form method="POST" class="" action="">
									{% csrf_token %}
									<button class="btn btn-danger mx-4" type="submit">Delete</button>
				                  	<a href="{% url 'web:list_group' %}">
										<button type="button" class="btn btn-primary">Cancel</button>
									</a>
								</form>

							</div>
						</div>
					</div>
				</div>
			</div>
			<!-- /.card-body -->
		</div>
		<!-- /.card -->

	</section>
	<!-- /.content -->
</div>

{% endblock %}
