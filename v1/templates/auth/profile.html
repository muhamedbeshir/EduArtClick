{% extends "admin_main_base.html" %}
{% block head_title %}User Create{% endblock %}

{% block content %}

	<!-- Content Wrapper. Contains page content -->
  	<div class="content-wrapper d-block d-block px-5 py-3">
    	<!-- Content Header (Page header) -->
    	<div class="content-header">
	      	<div class="container-fluid">
		        <div class="row mb-2">
		          	<div class="col-sm-6">
		            	<h1 class="m-0">Create User Profile</h1>
		          	</div><!-- /.col -->
		        </div><!-- /.row -->
	      	</div><!-- /.container-fluid -->
    	</div>
    	<!-- /.content-header -->

    	<!-- Main content -->
    	<section class="content">
	      	<div class="container-fluid">
		        <div class="row">
		          	<!-- left column -->
		          	<div class="col-md-12">
		            	<!-- general form elements -->
		            	<div class="card card-primary">
		              		<div class="card-header">
		                	<h3 class="card-title">User Form</h3>
		              		</div>
		              		{% if form.errors %}
						      <p class="login-box-msg">
						      	{{form.non_field_errors}}
						      </p>
						    {% endif %}
		              		<!-- form start -->
			              	<form action="" method="post" enctype="multipart/form-data" autocomplete="off">
			              		{% csrf_token %}
				                <div class="card-body">
					                <div class="row">
					                  	<div class="col-3">
					                  		<div class="form-group">
						                  		<label for="">First Name</label>
						                    	<input type="text" class="form-control" placeholder="First name" name="first_name" autocomplete="off">
						                    </div>
					                  	</div>
					                  	<div class="col-3">
					                  		<div class="form-group">
						                  		<label for="">Last Name</label>
						                    	<input type="text" class="form-control" placeholder="Last name" name="last_name" autocomplete="off">
						                    </div>
					                  	</div>
					                </div>
					                <div class="row">
					                  	<div class="col-6">
					                  		<div class="form-group">
						                  		<label for="">Email</label>
						                    	<input type="email" class="form-control" id="exampleInputEmail1" placeholder="Enter email" name="email" autocomplete="false">
						                    </div>
					                  	</div>
					                </div>
					                <div class="row">
					                  	<div class="col-6">
					                  		<div class="form-group">
						                  		<label for="">Password</label>
				                    			<input type="password" class="form-control" id="exampleInputPassword1" placeholder="Password" name="password" autocomplete="new-password">
						                    </div>
					                  	</div>
					                </div>
					                <div class="row">
					                  	<div class="col-6">
					                  		<div class="form-group">
						                  		<label for="exampleInputFile">Picture</label>
							                    <div class="input-group">
							                      <div class="custom-file">
							                        {{form.avtar}}
							                      </div>
							                    </div>
						                    </div>
					                  	</div>
					                </div>
				                </div>
				                <!-- /.card-body -->

				                <div class="card-footer">
				                  	<button type="submit" class="btn btn-primary">Submit</button>
				                </div>
			              	</form>
		            	</div>
		            	<!-- /.card -->

		          	</div>
		          	<!--/.col (left) -->
		        
		        </div>
		        <!-- /.row -->
	      	</div><!-- /.container-fluid -->
    	</section>
    	<!-- /.content -->
  	</div>

{% endblock %}
