{% load i18n %}
{% load i18n %}
<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account create succes message | Teachia</title>
  <link rel="icon" type="image/x-icon" href="{% static 'teachia.png' %}">

  <!-- Google Font: Source Sans Pro -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="{% static 'admin/plugins/fontawesome-free/css/all.min.css' %}">
  <!-- icheck bootstrap -->
  <link rel="stylesheet" href="{% static 'admin/plugins/icheck-bootstrap/icheck-bootstrap.min.css' %}">
  <!-- Theme style -->
  <link rel="stylesheet" href="{% static 'admin/dist/css/adminlte.min.css' %}">

  <style>
		/* Modify error list style  */
		.errorlist.nonfield {
			display: contents !important;
			list-style: none !important;
		}
		body {
			background: url("{% static 'img/lines-bg.png' %}"), url("{% static 'img/lines-bg1.png' %}") left bottom no-repeat;
		}
		label {
			font-size: 15px;
		}		
	</style>
  
</head>

<body class="hold-transition login-page">
  <div class="login-box">
    <div class="card card-outline card-primary">
      <div class="card-body login-card-body">
        <p>{% translate "Your account has been successfully created, please check your email to verify your account" %}
        </p>
        <div class="w-100 text-center">
          <a href="{% url 'web:login_page' %}" class="btn btn-primary col-6 p-2">Login</a>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
