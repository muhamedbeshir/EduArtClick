{% load i18n static %}
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password </title>
  <link rel="icon" type="image/x-icon" href="{% static 'logo.svg' %}">

  <!-- Google Font: Source Sans Pro -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="{% static 'admin/plugins/fontawesome-free/css/all.min.css' %}">
  <!-- icheck bootstrap -->
  <link rel="stylesheet" href="{% static 'admin/plugins/icheck-bootstrap/icheck-bootstrap.min.css' %}">
  <!-- Theme style -->
  <link rel="stylesheet" href="{% static 'admin/dist/css/adminlte.min.css' %}">
  <!-- LOGIN PAGE STYLE -->
	<link rel="stylesheet" href="{% static 'css/login_page.css' %}">
  <style>
    body {
			background: url("{% static 'img/lines-bg.png' %}"), url("{% static 'img/lines-bg1.png' %}") left bottom no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 150px;
		}
  </style>
</head>
<body>
<div class="login-box">
  <div class="card rounded shadow">
    <div class="card-header">
      <a href="" class="h1"><b>Reset Password</b></a>
    </div>
    <div class="card-body login-card-body">
    <p class="login-box-msg">{% translate "Please enter your new password twice so we can verify you typed it in correctly." %}</p>
        <form method="post">{% csrf_token %}
            <div class="form-row field-password1">
                {{ form.new_password.errors }}
                <label for="id_new_password1">{% translate 'New password' %}</label>
                <input type="password" name="new_password1" autocomplete="new-password" required="" id="id_new_password1" class="form-control">
            </div>
            <div class="form-row field-password2">
                {{ form.new_password2.errors }}
                <label for="id_new_password2">{% translate 'Confirm password' %}</label>
                <input type="password" name="new_password2" autocomplete="new-password" required="" id="id_new_password2" class="form-control">
            </div>
            <input type="hidden" name="token" value="{{ctoken}}" autocomplete="" required="" id="" class="form-control">
            <br>
      <div class="row">
            <div class="col-12">
              <input type="submit" class="btn btn-outline-primary btn-block" value="{% translate 'Change my password' %}">
            </div>
            <!-- /.col -->
          </div>
    </form>
    </div>
  </div>
</div>
</body>
</html>
