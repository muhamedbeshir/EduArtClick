{% extends "admin_main_base.html" %}
{% block head_title %}Dashboard{% endblock %}
{% load static %}
{% load auth_extras %}
{% block extra_head %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'admin/plugins/fullcalendar/main.css' %}">
<script src='https://unpkg.com/tooltip.js/dist/umd/tooltip.min.js'></script>
<style>
	a {
		text-decoration: none;
	}
	.card {
		border: 0;
	}
</style>
{% endblock %}

{% block content %}
<div class="content-wrapper d-block d-block px-5 py-3">
	<section class="content">
		<div class="container-fluid">
			<div class="row">
				<div class="col-md-12">
					<div class="card card-primary">
						<div class="card-body p-0 my-5">
							<div id="calendar"></div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>
</div>

{% endblock %}

{% block extra_script %}
<script src="{% static 'admin/plugins/fullcalendar/main.js' %}"></script>
<script>
	document.addEventListener('DOMContentLoaded', function () {
		var calendarEl = document.getElementById('calendar');
		const events = [];
		"{% for event in events %}"
		events.push(
			{
				title: "{{event.title}}",
				start: "{{event.start}}",
				description: "Class: {{event.title}}, Class Date: {{event.start}}, Schedule: {{event.schedule}}, Teacher: {{event.teacher}}, Room: {{event.room}}",
				color: "{{event.color}}",
			}
		);
		"{% endfor %}"
		console.log(events);

		var calendar = new FullCalendar.Calendar(calendarEl, {
			timeZone: 'UTC',
			themeSystem: 'bootstrap5',
			headerToolbar: {
				left: 'prev,next',
				center: 'title',
				right: 'dayGridMonth,timeGridWeek,timeGridDay,listMonth'
			},
			//weekNumbers: true,
			dayMaxEvents: true, // allow "more" link when too many events
			// events: 'https://fullcalendar.io/api/demo-feeds/events.json'
			events: events,
			eventDidMount: function(info) {
				$(info.el).popover({ 
					title: info.event._def.extendedProps.description,
					placement: 'top',
					trigger: 'hover',
					container: 'body',
				});
			},
			// eventClick: function (info) {
			// 	console.log(info);
			// },
			// eventMouseEnter: function(info) {
			// 	console.log(info);
			// },
			// eventMouseLeave: function(info) {
			// 	console.log(info);
			// },
		});

		calendar.render();

	});
</script>
{% endblock%}
