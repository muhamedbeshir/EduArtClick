{% load static %}
<!doctype html>
<html lang="en">

<head>
	<!-- Required meta tags -->
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<!-- Bootstrap CSS -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

	<title>Download Transaction</title>

	<style>
		.success-bg {
			position: absolute;
			right: 0;
			bottom: 0;
			/* opacity: .1; */
		}

		img.success-bg {
			opacity: .1;
		}

		.success-content {
			position: relative;
		}

		.success-page .success-icon {
			font-size: 5rem;
		}

		.success-img {
			position: absolute;
			left: 0;
		}

		th strong {
			font-weight: 700;
			display: flex;
			justify-content: center;
		}

		.align-items-center,
		.align-itemscenter {
			justify-content: center;
		}
	</style>
</head>

<body>
	<!-- Content wrapper -->
	<div class="content-wrapper">
		<!-- <img class="success-bg" src="{% static 'img/success-bg.png' %}"> -->
		<div class="container-xxl container-p-y text-center">
			<div class="misc-wrapper">
				<div class="col-md-6 mx-auto my-auto">
					<div class="card shadow rounded my-5">
						<div class="card-body success-page">
							<!-- <img src="{% static 'img/success-png.png' %}" class="w-100 success-img"> -->
							<div class="success-content">
								<div class="mt-5">
									<i class="ri-checkbox-circle-line success-icon text-success"></i>
								</div>
								<h2 class="mb-5">Payment Successful</h2>
								<p class="py-2 bg-success text-white rounded"><strong>Transaction ID:</strong>
									<span>{{ transaction_id }}</span>
								</p>
								<table class="table table-bordered my-3 rounded">
									<tr class="bg-secondary text-light">
										<th>Application</th>
										<th>School</th>
										<th>Course Name</th>
										<th>Total Price</th>
										<th>Transaction Date</th>
									</tr>
									<tr>
										<td><strong>{{ ap_code }}</strong></td>
										<td><strong>{{ school_name }}</strong></td>
										<td><strong>{{ ap_course_name }}</strong></td>
										<td><strong>{{ currency }} {{ total_price }}/-</strong></td>
										<td><strong>{{ created_at }}</strong></td>
									</tr>
								</table>
							</div>
							<div class="card mt-5">
								<h5 class="card-header mb-4">Invoice Details</h5>
								<div class="table-responsive text-nowrap">
									{{ invoice | safe }}
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<!-- Content wrapper -->
	<!-- Optional JavaScript; choose one of the two! -->

	<!-- Option 1: Bootstrap Bundle with Popper -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
		crossorigin="anonymous"></script>

</body>

</html>
